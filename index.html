<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英單防線：傳說塔防 (爽快通關版)</title>
<style>
  :root {
    --p-color: #0ff;
    --s-color: #f0f;
    --bg-dark: #050510;
    --ui-bg: rgba(10, 10, 25, 0.9);
    --btn-bg: #1a1a3a;
    --err: #ff3366;
    --succ: #33ffaa;
    --gold: #ffd700;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
  body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: white; }
  
  #app { position: relative; width: 100%; max-width: 480px; height: 100dvh; background: var(--bg-dark); overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
  
  /* Canvas Layers */
  #bg-canvas, #game-canvas, #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #bg-canvas { z-index: 1; }
  #game-canvas { z-index: 5; } /* Combat render */
  #ui-canvas { z-index: 15; } /* Confetti/VFX over UI */
  
  /* UI Screens */
  .screen, .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; }
  .screen { z-index: 10; }
  .modal { z-index: 30; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); padding: 20px; overflow-y: auto; pointer-events: auto; justify-content: flex-start; }
  .active { display: flex !important; }
  
  /* Global Buttons & Text */
  .btn { pointer-events: auto; background: var(--btn-bg); border: 2px solid var(--p-color); color: var(--p-color); padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-shadow: 0 0 5px var(--p-color); box-shadow: inset 0 0 10px rgba(0,255,255,0.2); transition: transform 0.1s, filter 0.1s; text-align: center; }
  .btn:active { transform: scale(0.95); filter: brightness(1.2); }
  .btn:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
  .modal-close { position: absolute; top: 15px; right: 15px; z-index: 40; }
  h1, h2, h3 { margin: 0; text-align: center; }
  .text-glow-cyan { color: var(--p-color); text-shadow: 0 0 10px var(--p-color); }
  .text-glow-gold { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
  .text-glow-magenta { color: var(--s-color); text-shadow: 0 0 10px var(--s-color); }
  
  /* HUD */
  .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; z-index: 20; display: flex; justify-content: space-between; pointer-events: none; text-shadow: 1px 1px 3px #000; }
  .fps { font-size: 10px; color: #555; position: absolute; top: 5px; right: 5px; }
  
  /* --- Screen: Main Menu --- */
  #main-menu { background: linear-gradient(to bottom, rgba(0,10,30,0.8), rgba(0,0,10,0.9)); justify-content: space-between; padding-bottom: 20px; pointer-events: auto; }
  
  /* Commander Bar */
  .commander-bar { display: flex; flex-direction: column; padding: 10px; background: rgba(20,20,40,0.8); border-bottom: 2px solid var(--p-color); }
  .cmd-top { display: flex; justify-content: space-between; align-items: center; }
  .rank-title { font-size: 18px; font-weight: 900; background: linear-gradient(90deg, #0ff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .coins-display { font-size: 16px; font-weight: bold; color: var(--gold); display: flex; align-items: center; gap: 5px; }
  .cmd-actions { display: flex; justify-content: space-between; margin-top: 10px; gap: 10px; }
  
  /* Hangar Showcase */
  .hangar { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; perspective: 1000px; margin: 10px 0; }
  .hangar-title { position: absolute; top: 0; font-size: 14px; color: #aaa; letter-spacing: 2px; }
  #hangar-canvas-container { width: 200px; height: 200px; position: relative; }
  #hangar-canvas { position: absolute; width: 100%; height: 100%; }
  .hangar-info { text-align: center; margin-top: 10px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; border: 1px solid #444; }
  .rarity-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 5px; color:#000; }
  
  /* Campaign Boards */
  .campaign-container { display: flex; flex-direction: column; gap: 15px; padding: 0 20px; }
  .campaign-card { position: relative; height: 90px; border-radius: 12px; overflow: hidden; border: 2px solid #555; display: flex; align-items: center; padding: 15px; cursor: pointer; transition: border-color 0.2s; background: linear-gradient(135deg, #1a1a2a, #2a2a4a); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
  .campaign-card::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%); transform: rotate(45deg); transition: 0.5s; pointer-events: none; }
  .campaign-card:active::after { left: 100%; }
  .campaign-card.vocab { border-color: var(--p-color); }
  .campaign-card.grammar { border-color: var(--s-color); }
  .c-card-content { z-index: 2; width: 100%; }
  .c-card-title { font-size: 22px; font-weight: 900; margin-bottom: 5px; }
  .vocab .c-card-title { color: var(--p-color); }
  .grammar .c-card-title { color: var(--s-color); }
  .c-card-prog { font-size: 14px; color: #ccc; display: flex; justify-content: space-between; }
  .prog-bar-bg { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .prog-bar-fill { height: 100%; transition: width 0.3s; }
  .vocab .prog-bar-fill { background: var(--p-color); }
  .grammar .prog-bar-fill { background: var(--s-color); }
  
  /* Bottom Corner Buttons */
  .sys-btn-container { display: flex; justify-content: space-between; padding: 0 20px; margin-top: 15px; }
  .sys-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; text-align: center; border: 3px solid; cursor: pointer; position: relative; background: radial-gradient(circle, #223, #001); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .sys-btn.gacha { border-color: var(--gold); color: var(--gold); }
  .sys-btn.dex { border-color: var(--s-color); color: var(--s-color); }
  .sys-btn:active { transform: scale(0.9); }
  .sys-btn-icon { font-size: 24px; margin-bottom: 2px; }
